        {checking ? "מחפשת..." : "המשך"}
      </button>
      <a href="./" style={{ color: COLORS.muted }} className="block text-center text-xs">ביטול</a>
    </CenteredScreen>
  );
}

function Landing() {
  const [deferredInstallPrompt, setDeferredInstallPrompt] = useState(null);
  const [isIOS, setIsIOS] = useState(false);
  const [isStandalone, setIsStandalone] = useState(false);
  const [showIOSTip, setShowIOSTip] = useState(false);
  const [installBannerDismissed, setInstallBannerDismissed] = useState(false);

  useEffect(() => {
    registerServiceWorker();
    setIsIOS(/iphone|ipad|ipod/i.test(window.navigator.userAgent) && !window.MSStream);
    setIsStandalone(
      window.matchMedia?.("(display-mode: standalone)")?.matches || window.navigator.standalone === true
    );
    const onBeforeInstall = (e) => {
      e.preventDefault();
      setDeferredInstallPrompt(e);
    };
    const onInstalled = () => {
      setDeferredInstallPrompt(null);
      setInstallBannerDismissed(true);
    };
    window.addEventListener("beforeinstallprompt", onBeforeInstall);
    window.addEventListener("appinstalled", onInstalled);
    return () => {
      window.removeEventListener("beforeinstallprompt", onBeforeInstall);
      window.removeEventListener("appinstalled", onInstalled);
    };
  }, []);

  async function handleInstallClick() {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      setDeferredInstallPrompt(null);
    } else if (isIOS) {
      setShowIOSTip(true);
    }
  }

  return (
    <div style={{ background: COLORS.bg, minHeight: "100vh" }} className="flex items-center justify-center px-5">
      <div className="w-full max-w-sm text-center space-y-6">
        <div>
          <span style={{ color: COLORS.rose }} className="text-3xl leading-none">✦</span>
          <h1 style={{ fontFamily: "'Frank Ruhl Libre', serif", color: COLORS.ink }} className="text-2xl font-bold mt-2">
            לוח תורים חכם
          </h1>
          <p style={{ color: COLORS.muted }} className="text-sm mt-1">
            קביעת תורים חכמה לכל בעל/ת עסק
          </p>
        </div>
        <div className="space-y-3">
          <a href="?clientLogin=1" style={{ background: COLORS.rose }} className="block text-white py-3 rounded-xl text-sm font-medium">
            👤 כניסה לקביעת תור
          </a>
        </div>
        <div style={{ borderColor: COLORS.line }} className="border-t pt-4 space-y-2">
          <p style={{ color: COLORS.muted }} className="text-xs">לבעלות עסקים</p>
          <div className="flex gap-2">
            <a href="?login=1" style={{ borderColor: COLORS.rose, color: COLORS.rose }} className="flex-1 border-2 py-2.5 rounded-xl text-sm font-medium">
              כניסה לעסק קיים
            </a>
            <a href="?register=1" style={{ borderColor: COLORS.rose, color: COLORS.rose }} className="flex-1 border-2 py-2.5 rounded-xl text-sm font-medium">
              🏪 עסק חדש
            </a>
          </div>
        </div>

        {!isStandalone && !installBannerDismissed && (deferredInstallPrompt || isIOS) && (
          <div style={{ borderColor: COLORS.line, background: "white" }} className="border rounded-xl p-3 flex items-center justify-between gap-3">
            <p style={{ color: COLORS.muted }} className="text-xs text-right">📲 אפשר להתקין את לוח תורים חכם כאפליקציה למסך הבית</p>
            <div className="flex items-center gap-2 shrink-0">
              <button onClick={handleInstallClick} style={{ background: COLORS.rose }} className="text-white text-xs px-3 py-1.5 rounded-full font-medium whitespace-nowrap">
                התקנה
              </button>
              <button onClick={() => setInstallBannerDismissed(true)} style={{ color: COLORS.muted }} className="text-xs">✕</button>
            </div>
          </div>
        )}
      </div>

      {showIOSTip && (
        <div className="fixed inset-0 flex items-center justify-center z-50" style={{ background: "rgba(43,29,34,0.45)" }}>
          <div style={{ background: "white", borderColor: COLORS.line }} className="border rounded-2xl p-5 w-[90%] max-w-xs space-y-3 text-center">
            <p style={{ fontFamily: "'Frank Ruhl Libre', serif" }} className="text-lg font-bold">התקנה למסך הבית</p>
            <p className="text-sm">
              לחצי על כפתור השיתוף <span className="inline-block">⬆️</span> בסרגל הכלים של ספארי, ואז בחרי <strong>"הוסף למסך הבית"</strong>.
            </p>
            <button onClick={() => setShowIOSTip(false)} style={{ background: COLORS.rose }} className="text-white text-sm px-4 py-2 rounded-lg font-medium w-full">
              הבנתי
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// --- Top-level router based on the URL: ?register=1 / ?login=1 / ?clientLogin=1 / ?biz=<id> / ?admin=1 / default landing ---
function Root() {
  const params = new URLSearchParams(window.location.search);
  if (params.has("register")) return <BusinessRegister />;
  if (params.has("login")) return <BusinessLogin />;
  if (params.has("clientLogin")) return <ClientBusinessFinder />;
  if (params.has("admin")) return <AdminGate><AdminDashboard /></AdminGate>;
  const bizParam = params.get("biz");
  if (bizParam) return <BizGateway bizId={bizParam} />;
  return <Landing />;
}

function bootstrap() {
  if (!window.storage) {
    setTimeout(bootstrap, 20);
    return;
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
}
bootstrap();
</script>
</body>
</html>
